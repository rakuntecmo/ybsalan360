<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Admin Giriş</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
  class="min-h-screen bg-cover bg-center flex items-center justify-center p-4"
  style="background-image: url('/background.png');"
>
  <div class="bg-white bg-opacity-90 rounded-2xl shadow-lg p-8 w-full max-w-sm text-center">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Admin Girişi</h2>
    <form action="/admin-login" method="POST" class="space-y-4 text-left">
      <div>
        <label class="block font-medium">Şifre</label>
        <input
          type="password"
          name="password"
          placeholder="Admin şifresi"
          required
          class="w-full border rounded px-4 py-2"
        />
      </div>
      <div>
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-6 rounded w-full"
        >
          Giriş Yap
        </button>
      </div>
    </form>
  </div>
</body>
</html>
