<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
  class="min-h-screen bg-cover bg-center flex items-center justify-center p-4"
  style="background-image: url('/background.png');"
>
  <div class="bg-white bg-opacity-90 rounded-2xl shadow-lg p-8 w-full max-w-xl text-center">
    <h2 class="text-3xl font-bold mb-6 text-gray-800">
      Hoş geldiniz, <span id="userName" class="text-blue-600">Katılımcı</span>!
    </h2>
    <p class="text-gray-700 mb-6">Üniversiteniz: <span id="userUniversity" class="font-semibold"></span></p>

    <!-- İki buton yan yana -->
    <div class="flex flex-col sm:flex-row justify-center gap-4">
      <a href="/roadmap" class="bg-amber-400 hover:bg-amber-500 text-white font-semibold py-3 px-6 rounded shadow text-center">
        Zirvenin Yol Haritası
      </a>
      <a href="/sessions" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded shadow text-center">
        Seanslara Git
      </a>
    </div>
  </div>

  <script>
    document.getElementById("userName").innerText = sessionStorage.getItem("name") || "Katılımcı";
    document.getElementById("userUniversity").innerText = sessionStorage.getItem("university") || "Bilinmiyor";
  </script>
</body>
</html>
