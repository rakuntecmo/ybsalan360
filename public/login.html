<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap - YBS Alan 360 Zirvesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
  class="min-h-screen bg-cover bg-center flex items-center justify-center p-4"
  style="background-image: url('/background.png');"
>
  <div class="bg-white bg-opacity-90 rounded-2xl shadow-lg p-6 w-full max-w-md w-full relative">
    <!-- Hatalı giriş mesajı -->
    <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm" role="alert">
      <strong>Hata!</strong> E-posta veya şifre hatalı.
    </div>

    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Giriş Yap</h2>
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block font-medium mb-1">E-posta</label>
        <input type="email" name="email" required class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <label class="block font-medium mb-1">Şifre</label>
        <input type="password" name="password" required class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded w-full">
          Giriş Yap
        </button>
      </div>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("error") === "1") {
      document.getElementById("errorMessage").classList.remove("hidden");
    }
  </script>
</body>
</html>
