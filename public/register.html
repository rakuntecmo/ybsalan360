<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kayıt Ol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
  class="min-h-screen bg-cover bg-center flex items-center justify-center p-4"
  style="background-image: url('/background.png');"
>
  <div class="bg-white bg-opacity-90 rounded-2xl shadow-lg p-8 w-full max-w-xl">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Kayıt Ol</h2>
    <form action="/submit" method="POST" class="space-y-4">
      <div>
        <label class="block font-medium">Ad Soyad</label>
        <input type="text" name="name" required class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <label class="block font-medium">E-posta</label>
        <input type="email" name="email" required class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <label class="block font-medium">Telefon</label>
        <input type="tel" name="phone" class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <label class="block font-medium">Üniversiteniz</label>
        <input type="text" name="university" required class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <label class="block font-medium">Şifre</label>
        <input type="password" name="password" required class="w-full border rounded px-4 py-2" />
      </div>
      <div>
        <label class="inline-flex items-center">
          <input type="checkbox" required class="mr-2" />
          <span class="text-sm text-gray-700">KVKK metnini okudum, kabul ediyorum.</span>
        </label>
      </div>
      <div>
        <button type="submit" class="bg-amber-400 hover:bg-amber-500 text-white font-semibold py-3 px-6 rounded w-full">
          Kaydı Tamamla
        </button>
      </div>
    </form>
  </div>
</body>
</html>
