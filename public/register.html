<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayıt Ol - YBS Alan 360 Zirvesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body
  class="min-h-screen bg-cover bg-center flex items-center justify-center p-4"
  style="background-image: url('/background.png');"
>
  <div class="bg-white bg-opacity-90 rounded-2xl shadow-lg p-6 w-full max-w-md">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Kayıt Ol</h2>

    <form action="/submit" method="POST" onsubmit="return validateForm()" class="space-y-4">
      <div>
        <label class="block font-medium mb-1">Ad Soyad</label>
        <input type="text" name="name" required class="w-full border rounded px-4 py-2" />
      </div>

      <div>
        <label class="block font-medium mb-1">E-posta</label>
        <input type="email" name="email" required class="w-full border rounded px-4 py-2" />
      </div>

      <div>
        <label class="block font-medium mb-1">Telefon</label>
        <input type="tel" name="phone" class="w-full border rounded px-4 py-2" />
      </div>

      <div>
        <label class="block font-medium mb-1">Üniversiteniz</label>
        <select name="university" required class="w-full border rounded px-4 py-2">
          <option value="" disabled selected>Üniversitenizi seçin</option>
          <option value="ADÜ">Aydın Adnan Menderes Üniversitesi (ADÜ)</option>
          <option value="İTÜ">İstanbul Teknik Üniversitesi (İTÜ)</option>
          <option value="KOÜ">Kocaeli Üniversitesi (KOÜ)</option>
        </select>
      </div>

      <div>
        <label class="block font-medium mb-1">Şifre</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          maxlength="8"
          minlength="8"
          pattern="\d{8}"
          class="w-full border rounded px-4 py-2"
          placeholder="8 haneli rakam"
        />
      </div>

      <div>
        <label class="block font-medium mb-1">Şifreyi Tekrar Girin</label>
        <input
          type="password"
          id="confirmPassword"
          required
          maxlength="8"
          minlength="8"
          pattern="\d{8}"
          class="w-full border rounded px-4 py-2"
          placeholder="Aynı şifreyi tekrar yazın"
        />
      </div>

      <div>
        <label class="inline-flex items-center">
          <input type="checkbox" required class="mr-2" />
          <span class="text-sm text-gray-700">KVKK metnini okudum, kabul ediyorum.</span>
        </label>
      </div>

      <p class="text-xs text-gray-500">
        Şifreniz yalnızca 8 haneli rakamlardan oluşmalıdır.
      </p>

      <div>
        <button type="submit" class="bg-amber-400 hover:bg-amber-500 text-white font-semibold py-3 px-6 rounded w-full">
          Kaydı Tamamla
        </button>
      </div>
    </form>
  </div>

  <script>
    function validateForm() {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        alert("Şifreler uyuşmuyor!");
        return false;
      }

      if (!/^\d{8}$/.test(password)) {
        alert("Şifre yalnızca 8 haneli rakamlardan oluşmalıdır.");
        return false;
      }

      return true;
    }
  </script>
</body>
</html>
